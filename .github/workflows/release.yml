name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows updater release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SemVer tag
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Updater releases must use a SemVer tag like v0.2.0."
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## 更新内容

            - 修复 AI 模型选择模式问题，模型列表选择和手动输入模式现在能按设置正确切换。
            - 修复在开场白页将备用开场白设为第一条消息时，原第一条消息没有回到备用开场白列表的问题；现在会交换两者，避免备用列表项被直接移除。
            - 新增安装版自动更新能力：应用会检查 GitHub Release 的 `latest.json`，发现新版本后可确认下载、安装并重启。
            - 新增设置页更新控制：可开启/关闭启动自动检查，也可以手动检查更新。
            - 新增 GitHub Actions 发布流程：推送 `v*.*.*` SemVer tag 后构建 Windows 安装包，并上传 updater 所需的 `latest.json`。
            - Agent Studio 成为默认入口，版本升级到 `v0.2.0`。

            ## 安装包

            - NSIS：下载 `SillyTavern Card Creator_0.2.0_x64-setup.exe`
            - MSI：下载 `SillyTavern Card Creator_0.2.0_x64_en-US.msi`
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
